name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: ./build.sh --check
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --zip
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Nook $GITHUB_REF_NAME" --notes "Download Nook.zip, unzip it and drag Nook into Applications. Open it once; when macOS blocks it, go to System Settings → Privacy & Security and click Open Anyway."
          gh release upload "$GITHUB_REF_NAME" build/Nook.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
